name: scan

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: 'main'
      build_path:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Load build configuration
        id: build
        run: |
          set -a
          . ./build/${{ inputs.build_path }}/.env
          set +a
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ steps.build.outputs.image_name }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.76.1'
          scan-type: image
          input: ${{ steps.build.outputs.image_name }}.tar
          scanners: vuln
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Summarize scan with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python3 scripts/summarize_trivy.py trivy-report.json
