name: build-test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit SHA to test. Defaults to main.'
        required: false
        type: string
        default: 'main'
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '.github/**'
  pull_request:
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

jobs:
  helix-p4d:
    uses: ./.github/workflows/build.yml
    with:
      should_push: 'false'
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_path: helix-p4d
    secrets: inherit

  helix-proxy:
    uses: ./.github/workflows/build.yml
    with:
      should_push: 'false'
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_path: helix-proxy
    secrets: inherit

  helix-auth-svc:
    uses: ./.github/workflows/build.yml
    with:
      should_push: 'false'
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_path: helix-auth-svc
    secrets: inherit