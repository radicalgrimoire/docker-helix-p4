name: build-develop

run-name: >
  ${{ github.event_name == 'workflow_call' && 'Reusable Build' || 'Manual Build' }}
  by @${{ github.actor }}

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
        default: 'main'
      build_path:
        required: false
        type: string
        default: 'helix-p4d'
    secrets:
      GEMINI_API_KEY:
        required: false

  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit SHA to build. Defaults to main.'
        required: false
        type: string
      build_path:
        description: 'Service to build.'
        required: false
        type: choice
        options:
          - helix-p4d
          - helix-proxy
          - helix-swarm
          - helix-auth-svc
        default: 'helix-p4d'

concurrency:
  group: publish-${{ github.repository }}-${{ inputs.build_path || 'helix-p4d' }}
  cancel-in-progress: false

jobs:
  # Display commit information
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_ref || 'main' }}
      - name: Display build information
        run: |
          echo "Build Information:"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Actor: ${{ github.actor }}"
          echo "Source ref: ${{ inputs.source_ref || 'main' }}"
          echo "Build path: ${{ inputs.build_path || 'helix-p4d' }}"
          echo ""
          # Get last commit author and message
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s" HEAD)
          echo "Auther: ${COMMIT_AUTHOR} / ${COMMIT_MESSAGE}"

  build:
    needs: info
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/build.yml@main
    with:
      source_ref: ${{ inputs.source_ref || 'main' }}
      build_path: ${{ inputs.build_path || 'helix-p4d' }}
    secrets: inherit

  scan:
    needs: build
    if: inputs.build_path == 'helix-auth-svc' || inputs.build_path == 'helix-swarm'
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/scan.yml@main
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.source_ref || 'main' }}
      build_path: ${{ inputs.build_path || 'helix-p4d' }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Get image version
  get-version:
    needs: build
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/get-version.yml@main
    with:
      source_ref: ${{ inputs.source_ref || 'main' }}
      build_path: ${{ inputs.build_path || 'helix-p4d' }}
    secrets: inherit

  delete-image:
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/delete-image.yml@main
    needs: [get-version, scan]
    if: ${{ !cancelled() && needs.get-version.result == 'success' && (needs.scan.result == 'success' || needs.scan.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.get-version.outputs.version }}
      source_ref: ${{ inputs.source_ref || 'main' }}
      build_path: ${{ inputs.build_path || 'helix-p4d' }}
    secrets: inherit

  # Push image to GitHub Packages.
  push:
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/publish.yml@main
    needs: [get-version, delete-image]
    if: ${{ !cancelled() && needs.get-version.result == 'success' && needs.delete-image.result == 'success' }}
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.get-version.outputs.version }}
      version_raw: ${{ needs.get-version.outputs.version_raw }}
      source_ref: ${{ inputs.source_ref || 'main' }}
      build_path: ${{ inputs.build_path || 'helix-p4d' }}
    secrets: inherit
