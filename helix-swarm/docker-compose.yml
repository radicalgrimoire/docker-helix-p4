name: helix-swarm

services:
  p4-code-review:
    image: ${SWARM_IMAGE:-ghcr.io/radicalgrimoire/docker-helix-p4/helix-swarm:2026.4}
    init: true
    restart: unless-stopped
    environment:
      P4D_PORT: ${P4D_PORT:-}
      SWARM_USER: ${SWARM_USER:-}
      SWARM_PASSWD: ${SWARM_PASSWD:-}
      SWARM_HOST: ${SWARM_HOST:-localhost}
      SWARM_SSO: ${SWARM_SSO:-disabled}
    ports:
      - "${SWARM_HTTP_PORT:-80}:80"
      - "${SWARM_HTTPS_PORT:-443}:443"
    volumes:
      - swarm-data:/opt/perforce/swarm/data
      - swarm-file:/opt/perforce/etc/file
      - swarm-redis:/opt/perforce/swarm/redis

volumes:
  swarm-data:
    name: swarm_server_swarm-data
  swarm-file:
    name: swarm_server_file
  swarm-redis:
    name: swarm_server_redis
